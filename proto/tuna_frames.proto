syntax = "proto3";

package tuna;

// Tunnel wire protocol v1.
// Canonical spec: docs/plans/2026-09-23-tuna-execution-plan.md section 4.
// Encryption is TLS's responsibility, not the frame's, so there is no
// encrypted payload field. All framing is length-prefixed protobuf.

// Frame types. Numeric values are wire-stable across versions.
enum FrameType {
    FRAME_TYPE_UNSPECIFIED = 0;
    FRAME_TYPE_SYS = 1;
    FRAME_TYPE_GPU = 2;
    FRAME_TYPE_IO = 3;
    FRAME_TYPE_HEARTBEAT = 4;
    FRAME_TYPE_CONTROL = 5;
}

message FrameHeader {
    FrameType type = 1;
    uint64 frame_id = 2;      // 64-bit: avoids the wraparound bugs Neptune hit
    uint32 channel = 3;       // 0 = control, 1 = rpc, 2 = bulk
    uint64 timestamp_ns = 4;
}

message Frame {
    FrameHeader header = 1;
    bytes payload = 2;        // decoded per header.type; encryption is TLS's job
}

// CONTROL: the first frame sent in each direction after the transport is up.
message Hello {
    uint32 protocol_version = 1;
    string client_os = 2;
    uint32 cuda_driver_version = 3;   // server fills: cuDriverGetVersion()
    repeated DeviceInfo devices = 4;  // server fills
    bytes resume_token = 5;
}

message DeviceInfo {
    string name = 1;
    uint64 total_mem = 2;
    int32 cc_major = 3;
    int32 cc_minor = 4;
    bytes uuid = 5;
}

// GPU: a single remoted CUDA driver-API call.
message RpcRequest {
    uint64 call_id = 1;
    uint32 api_id = 2;        // generated enum, stable across versions
    uint32 flags = 3;         // bit0 = ASYNC (no reply expected), bit1 = HAS_BULK
    uint64 thread_id = 4;     // client thread -> server thread affinity
    bytes args = 5;           // generated compact little-endian encoding
    uint64 bulk_ref = 6;      // id of a payload on the bulk channel, if any
}

message RpcResponse {
    uint64 call_id = 1;
    int32 result = 2;         // CUresult
    bytes out_args = 3;
    uint64 bulk_ref = 4;
}

// Async calls coalesced into one frame.
message RpcBatch {
    repeated RpcRequest calls = 1;
}
