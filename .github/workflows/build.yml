name: Build and test

on:
  push:
  pull_request:

jobs:
  # Track A Windows client (gRPC via vcpkg) + Track B core unit tests.
  windows-client:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tuna-guest-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install gRPC and Protocol Buffers
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows

      - name: Configure Windows client
        shell: pwsh
        run: |
          cmake -S . -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTUNA_BUILD_GUI=OFF `
            -DTUNA_BUILD_SAMPLE_CLIENT=ON `
            -DTUNA_BUILD_LINUX_SERVER=OFF

      - name: Build Windows client
        run: cmake --build build --config Release --parallel

      - name: Smoke-test Windows sample client
        shell: pwsh
        run: .\build\bin\tuna_sample_app.exe --help

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

  # Track B server core on Windows: no gRPC, FetchContent protobuf.
  windows-server-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Track B TLS (Phase 2b) needs OpenSSL >= 3.0. Install the Shining Light
      # build and expose it to CMake (find root) and to the tests (DLLs on PATH).
      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl --no-progress -y
          $root = @("$env:ProgramFiles\OpenSSL-Win64", "$env:ProgramFiles\OpenSSL") |
            Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $root) { throw "OpenSSL install not found" }
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure server (remoting core only)
        run: cmake -S tuna-server -B build-server -A x64 -DTUNA_SERVER_WORKLOAD_API=OFF

      - name: Build server
        run: cmake --build build-server --config Release --parallel

      - name: Run server unit tests
        run: ctest --test-dir build-server -C Release --output-on-failure

  # Track A client + server + mTLS integration, and Track B tests, on Linux.
  linux-client-server:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    defaults:
      run:
        working-directory: tuna-guest-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install gRPC and Protocol Buffers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgrpc++-dev libprotobuf-dev \
            protobuf-compiler protobuf-compiler-grpc libssl-dev

      - name: Configure Linux contract test build
        run: |
          cmake -S . -B build \
            -DTUNA_BUILD_GUI=OFF \
            -DTUNA_BUILD_SAMPLE_CLIENT=ON \
            -DTUNA_BUILD_LINUX_SERVER=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build client and server
        run: cmake --build build --parallel

      - name: Run unit and mTLS integration tests
        run: ctest --test-dir build --output-on-failure

  # Track B CUDA runtime remoting (Phase 3), GPU-free: the shim
  # (libcudart.so.12), tuna_server with CUDA dispatch, the marshalling tests and
  # the end-to-end test against the mock CUDA stack. Needs only NVIDIA's
  # redistributable CUDA 12 headers, not a GPU or a driver.
  linux-cuda-remoting:
    runs-on: ubuntu-24.04
    env:
      CUDA_REDIST: https://developer.download.nvidia.com/compute/cuda/redist
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev python3 python3-pip
          python3 -m pip install --user --break-system-packages libclang==18.1.1 PyYAML

      - name: Fetch CUDA 12.8 headers (NVIDIA redistributables)
        run: |
          mkdir -p "$HOME/cuda"
          for pkg in cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-12.8.90-archive.tar.xz \
                     cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-12.8.93-archive.tar.xz; do
            curl -sSfL "$CUDA_REDIST/$pkg" | tar -xJ --strip-components=1 -C "$HOME/cuda"
          done

      # cuBLAS headers only (the archive also carries ~900 MB of libraries,
      # which nothing here needs); cached, since they change only with the pin.
      - name: Cache cuBLAS 12.8 headers
        id: cublas-cache
        uses: actions/cache@v4
        with:
          path: ~/cublas
          key: cublas-headers-linux-x86_64-12.8.4.1

      - name: Fetch cuBLAS 12.8 headers (NVIDIA redistributable)
        if: steps.cublas-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/cublas"
          curl -sSfL "$CUDA_REDIST/libcublas/linux-x86_64/libcublas-linux-x86_64-12.8.4.1-archive.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/cublas" --wildcards '*/include/*'

      - name: Committed codegen output is current
        run: |
          python3 tools/codegen/gen_cuda.py "$HOME/cuda/include" tools/codegen/annotations.yaml cuda/generated \
            --cublas "$HOME/cublas/include"
          git diff --exit-code -- cuda/generated tools/codegen/api_ids.yaml

      - name: Configure server with the CUDA shim (+ cuBLAS)
        run: |
          cmake -S tuna-server -B build-cuda -DTUNA_SERVER_WORKLOAD_API=OFF -DTUNA_BUILD_CUDA_SHIM=ON \
            -DTUNA_CUDA_INCLUDE_DIR="$HOME/cuda/include" -DTUNA_CUBLAS_INCLUDE_DIR="$HOME/cublas/include" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cuda --parallel

      - name: Run tests (unit, marshalling, CUDA + cuBLAS end-to-end over TCP and mTLS)
        run: ctest --test-dir build-cuda --output-on-failure
